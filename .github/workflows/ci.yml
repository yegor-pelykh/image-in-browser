# @format

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run normalize:src
      - run: git diff --exit-code -- src/
      - run: npm run format:prettier
      - run: npm run format:lint
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run build:src
